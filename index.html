<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>入画 · 听乐</title>
<style>
:root{--ink:#f3e6cf;--dim:rgba(243,230,207,.55);--bg:#0b0806}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Songti SC","STSong",serif;overflow:hidden}
#stage{position:fixed;inset:0}
.v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .6s ease}
.v.on{opacity:1}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 22vmin rgba(0,0,0,.75);transition:background .8s}
#sub{position:absolute;left:0;right:0;bottom:9%;text-align:center;font-size:clamp(18px,2.6vw,34px);letter-spacing:.12em;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .5s}
#sub small{display:block;font-size:.55em;color:var(--dim);letter-spacing:.3em;margin-bottom:.4em}
#card{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(11,8,6,.9);opacity:0;pointer-events:none;transition:opacity .8s;z-index:3}
#card.on{opacity:1}
#card h2{font-size:clamp(26px,4vw,52px);letter-spacing:.4em;font-weight:400}
#card p{margin-top:1em;color:var(--dim);letter-spacing:.25em;line-height:2}
#hint{position:absolute;right:4%;bottom:5%;font-size:clamp(13px,1.4vw,18px);letter-spacing:.4em;color:var(--dim);opacity:0;transition:opacity .8s}
#hint.on{opacity:1;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
#heat{position:absolute;left:4%;bottom:5%;width:16vw;height:2px;background:rgba(243,230,207,.12)}
#heat i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9772f,#f3c27a);transition:width .2s}
#tempo{position:absolute;left:4%;bottom:calc(5% + 14px);font-size:12px;letter-spacing:.3em;color:var(--dim);opacity:0;transition:opacity .5s}
.pop{position:absolute;font-size:clamp(22px,3vw,40px);color:#f3c27a;text-shadow:0 0 18px rgba(240,160,60,.7);pointer-events:none;animation:pop 1s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-60px) scale(1.2)}}
#cover{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#2a1a0f 0%,#0b0806 70%);z-index:5;transition:opacity .8s}
#cover h1{font-size:clamp(34px,5vw,64px);letter-spacing:.4em;font-weight:400}
#cover p{margin-top:1.2em;color:var(--dim);letter-spacing:.25em;line-height:2;text-align:center;font-size:clamp(13px,1.4vw,18px)}
#cover button{margin-top:2.2em;background:none;border:1px solid var(--dim);color:var(--ink);font:inherit;font-size:18px;letter-spacing:.5em;padding:.7em 1.6em .7em 2.1em;cursor:pointer}
#mute{position:fixed;right:16px;top:14px;z-index:8;background:rgba(0,0,0,.35);border:1px solid rgba(243,230,207,.35);color:var(--ink);font:14px/1 inherit;letter-spacing:.2em;padding:8px 12px;cursor:pointer;border-radius:2px}
#mute:hover{background:rgba(0,0,0,.6)}
#sndhint{margin-top:1.2em;font-size:13px;color:var(--dim);letter-spacing:.3em;animation:breathe 2.4s ease-in-out infinite}
#hud{position:absolute;top:8px;left:8px;font:12px monospace;color:#9a8;display:none;z-index:9}
body.hud #hud{display:block}
</style></head><body>
<div id="stage">
  <video class="v" id="va" playsinline preload="auto"></video>
  <video class="v" id="vb" playsinline preload="auto"></video>
  <img id="paint" src="frames/painting-crop.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none;background:#000">
  <img id="wide" src="frames/cg-wide.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none;background:#000;transition:opacity 1s">
  <div id="vig"></div>
  <div id="sub"></div>
  <div id="hint">拍手 · 叫好 · 空格</div>
  <div id="tempo"></div>
  <div id="heat"><i></i></div>
  <div id="card"><div><h2 id="cardT"></h2><p id="cardP"></p></div></div>
  <div id="cover"><div style="text-align:center">
    <h1>入画 · 听乐</h1>
    <p>你是韩熙载。今夜府中设宴。<br>宫里来了一位画师，他在看你。<br>若你闷闷不乐——拍手、叫好，装得尽兴些。</p>
    <button id="go">入 画</button>
    <p id="sndhint">轻触任意处 · 开启琵琶声</p>
    <p style="font-size:12px;margin-top:1.6em">允许麦克风：现场拍手、欢呼 ｜ 也可按空格 / 点屏幕 ｜ 建议戴耳机或开外放</p>
  </div></div>
  <button id="mute" title="静音 / 开声">声 · 开</button>
  <div id="hud"></div>
</div>
<script>
// 链路切片：3D 入画 → 被盯上(拍手分支) → 奏乐(打拍子控速) → 反打 → 3D 出画
const Q = new URLSearchParams(location.search); if (Q.has('hud')) document.body.classList.add('hud');
const $ = (s) => document.querySelector(s), now = () => performance.now(), clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const CLIP = {
  // 一条连续镜头：每段的首帧 = 上一段的尾帧（3D↔CG 处为叠化）
  e0: 'clips/e0-wide-to-painter.mp4',               // CG 全景 → 画师（首尾帧）
  c1: 'clips/v3-cg-3dcam.mp4', c2: 'clips/cg-c2-ask.mp4', c3: 'clips/cg-c3-relax.mp4',
  bridge1: 'clips/bridge1.mp4',                     // 跟画师走到琵琶女
  play: 'clips/cg-s6-play.mp4',
  bridge2: 'clips/bridge2.mp4',                     // 曲终拜别 → 横移到韩熙载
  revin: 'clips/cg-s8-in.mp4',                     // 反打倒放：从中景推近到韩熙载的脸（接得上过门 2 的尾帧）
  rev: 'clips/cg-s8-reverse.mp4',
  eend: 'clips/eend-to-wide.mp4',                   // 反打拉远 → CG 全景（首尾帧）
};
const VO = {};
const S = { heat: 0, state: 'cover', beats: [], waitT: 0, lastBeat: 0 };
const TH = 0.9;   // 每秒 3～4 下、连续约 4 秒才过关；说话不计
let cur = $('#va'), nxt = $('#vb');

async function exists(u) { try { return (await fetch(u, { method: 'HEAD' })).ok; } catch { return false; } }
function card(t, p, ms) { $('#cardT').textContent = t; $('#cardP').innerHTML = p || ''; $('#card').classList.add('on'); return new Promise((r) => setTimeout(() => { $('#card').classList.remove('on'); r(); }, ms)); }
// 播放一段；文件缺失时用字幕卡占位（如实标注），不假装有
// 预加载：每段一个独立 <video>，开场前全部加载好，切换时直接播放（之前切换时才加载 → 卡顿）
const VID = {};
async function preloadAll() {
  await Promise.all(Object.entries(CLIP).map(async ([k, u]) => {
    if (!(await exists(u))) return;
    const v = document.createElement('video'); v.className = 'v'; v.playsInline = true; v.preload = 'auto'; v.src = u; v.muted = false;
    $('#stage').insertBefore(v, $('#paint')); VID[k] = v; v.load();
    await new Promise((r) => { if (v.readyState >= 3) r(); else { v.addEventListener('canplaythrough', r, { once: true }); setTimeout(r, 8000); } });
  }));
}
function play(name, { onEnd, loop = false, rate = 1, until = 0.1, fade = 120 } = {}) {   // 默认：结束前 0.1 秒直接切（首尾帧一致=无缝）
  S.state = name;
  const v = VID[name];
  if (!v) { onEnd && setTimeout(onEnd, 50); return; }          // 素材缺失（如 3D 还没渲完）：直接跳过，不打断体验
  v.muted = MUTED; v.loop = loop; v.playbackRate = rate; v.preservesPitch = true; v.currentTime = 0; v.volume = 0;
  v.play().catch(() => {}); fadeVol(v, 1, Math.max(fade, 250));
  const prev = cur; v.style.transition = prev.style.transition = `opacity ${fade}ms linear`; v.classList.add('on'); prev.classList.remove('on'); fadeVol(prev, 0, Math.max(fade, 250)); setTimeout(() => { if (prev !== cur) prev.pause(); }, fade + 300);
  prev.onended = null; prev.ontimeupdate = null; cur = v;
  let done = false; const fire = () => { if (!done) { done = true; onEnd && onEnd(); } };
  v.onended = fire; v.ontimeupdate = !loop && until ? function () { if (this.duration && this.currentTime >= this.duration - until) fire(); } : null;
}
function fadeVol(el, to, ms) { const from = el.volume, t0 = now(); (function f() { const k = clamp((now() - t0) / ms); el.volume = from + (to - from) * k; if (k < 1) requestAnimationFrame(f); })(); }
// 夜宴底声：奏乐那段的琵琶声低音量循环（c1 画面里琵琶女本就在弹），奏乐段与反打段停掉
const BED = new Audio('clips/bed-pipa.m4a'); BED.loop = true; BED.volume = 0;
let MUTED = false, started = false;
function applyMute() { document.querySelectorAll('video,audio').forEach((m) => (m.muted = MUTED)); BED.muted = MUTED; $('#mute').textContent = MUTED ? '声 · 关' : '声 · 开'; }
$('#mute').addEventListener('pointerdown', (e) => { e.stopPropagation(); MUTED = !MUTED; applyMute(); if (!MUTED) startBed(); });
function startBed() { if (started) return; started = true; bed(true, .4); const h = $('#sndhint'); if (h) h.textContent = '琵琶声已开 · 点"入画"开始'; }
addEventListener('pointerdown', startBed, { once: false }); addEventListener('keydown', startBed);
function bed(on, vol = .22) { if (on) { BED.muted = MUTED; BED.play().catch(() => {}); fadeVol(BED, vol, 1500); } else fadeVol(BED, 0, 800); }
function say(html, ms = 3200, who = '') { const el = $('#sub'); el.innerHTML = (who ? `<small>${who}</small>` : '') + html; el.style.opacity = 1; clearTimeout(say.t); say.t = setTimeout(() => (el.style.opacity = 0), ms); }
function voice(k) { const a = new Audio(VO[k]); a.play().catch(() => {}); }

function onBeat(x, y) {
  if (S.state === 'cover') return;
  const t = now(); S.beats.push(t); S.total = (S.total || 0) + 1; S.beats = S.beats.filter((b) => t - b < 4000); S.lastBeat = t;
  S.heat = Math.min(1.2, S.heat + 0.08);
  if (S.state === 'play') clack();
  const p = document.createElement('div'); p.className = 'pop'; p.textContent = S.state === 'play' ? '♪' : ['好！', '妙！', '再来！', '好——'][S.beats.length % 4];
  p.style.left = (x ?? (20 + Math.random() * 60) * innerWidth / 100) + 'px'; p.style.top = (y ?? (35 + Math.random() * 25) * innerHeight / 100) + 'px';
  $('#stage').appendChild(p); setTimeout(() => p.remove(), 1000);
}
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); onBeat(); } if (e.key === 'h') document.body.classList.toggle('hud'); });
$('#stage').addEventListener('pointerdown', (e) => { if (e.target.id !== 'go') onBeat(e.clientX, e.clientY); });

let mic = null, AC = null;
// 檀板声：短促噪声 + 带通，像两片木板一合
function clack() {
  try {
    AC = AC || new AudioContext(); const t = AC.currentTime, n = AC.sampleRate * .06;
    const b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 6);
    const s = AC.createBufferSource(); s.buffer = b;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 4;
    const g = AC.createGain(); g.gain.setValueAtTime(1.6, t); g.gain.exponentialRampToValueAtTime(.001, t + .08);
    s.connect(f).connect(g).connect(AC.destination); s.start(t);
  } catch (e) {}
}
async function micOn() {
  try {
    AC = AC || new AudioContext();
    const st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
    const an = AC.createAnalyser(); an.fftSize = 1024; AC.createMediaStreamSource(st).connect(an);
    mic = { an, buf: new Float32Array(1024), floor: .01, prev: 0, last: 0, calib: now() + 1200 };
  } catch (e) { console.warn('mic', e.name); }
}
function micStep(dt) {
  if (!mic) return; mic.an.getFloatTimeDomainData(mic.buf);
  let s = 0; for (const v of mic.buf) s += v * v; const rms = Math.sqrt(s / mic.buf.length), t = now();
  if (t < mic.calib) { mic.floor = mic.floor * .9 + rms * .1; return; }
  mic.floor = rms < mic.floor * 1.8 ? mic.floor * .995 + rms * .005 : mic.floor * .9995 + rms * .0005;
  const lvl = clamp((rms / Math.max(mic.floor, 1e-4) - 1.5) / 8);
  if (rms > mic.floor * 5 && rms > .04 && rms > mic.prev * 2.2 && t - mic.last > 160) { mic.last = t; onBeat(); }   // 拍手=很尖的起音；说话的音节起音不够尖
  mic.prev = rms; if (lvl > .55) S.heat = Math.min(1.2, S.heat + (lvl - .55) * .5 * dt);                            // 只有响亮的欢呼才持续加热
}

// ---- 流程 ----
async function start() {   // 方案 A：原画 → CG 全景（构图由 Hi3D 3D 场景定）→ 镜头推进、画师走近
  const pi = $('#paint'), wi = $('#wide'); pi.style.transition = 'opacity 1.2s'; pi.style.opacity = 1;
  say('第一幕 · 听乐', 3400, '南唐 · 韩熙载府');
  setTimeout(() => { wi.style.opacity = 1; }, 2200);                                   // 原画叠化成 CG 全景
  setTimeout(() => { pi.style.opacity = 0; bed(true); play('e0', { fade: 10, onEnd: s5 }); setTimeout(() => (wi.style.opacity = 0), 150); }, 4700);   // 全景静帧停 1.5 秒后开始动
}
function s5() {
  bed(true); S.heat = 0; S.state = 'c1'; play('c1', { onEnd: () => (S.heat >= TH ? toC3() : toC2()) });
  setTimeout(() => say('宫里来的待诏……顾闳中。', 3000, '郎粲 低声'), 1200);
}
function toC2() {
  play('c2', { onEnd: () => { S.state = 'wait'; S.waitT = now(); $('#hint').classList.add('on'); cur.pause(); } });
  setTimeout(() => say('大人今夜……怎么闷闷不乐？', 2600, '顾闳中'), 150);
  setTimeout(() => { say('大人，该叫个好了。', 3000, '郎粲 凑近'); $('#hint').classList.add('on'); }, 3600);   // 只出字幕：合成配音和视频自带人声会叠在一起
}
function toC3() {
  $('#hint').classList.remove('on');
  play('c3', { until: 1.6, onEnd: () => play('bridge1', { onEnd: s6 }) });
  setTimeout(() => say('满座哄笑，顾待诏也笑了。', 2800), 900);
}
let s6T0 = 0, turned = false;
function s6() {
  S.beats = []; S.total = 0; S.steady = 0; S.lastBeat = now(); turned = false; s6T0 = now(); bed(false);
  play('play', { loop: true });
  say('跟着琵琶，打拍子', 3000, '奏乐');
  $('#hint').textContent = '跟着琴声 · 拍手打拍子'; $('#hint').classList.add('on'); $('#tempo').style.opacity = 1;
}
function s6Step() {
  const t = now(), n = S.beats.length;
  const bpm = n >= 2 ? 60000 / ((S.beats[n - 1] - S.beats[0]) / (n - 1)) : 0;
  const idle0 = t - S.lastBeat;
  const rate = bpm && idle0 < 1500 ? clamp(0.6 + (bpm - 60) / 80, 0.6, 1.9) : 0.6;   // 你的拍子 = 琴的快慢；不拍就慢下来
  if (Math.abs(cur.playbackRate - rate) > .02) cur.playbackRate += (rate - cur.playbackRate) * .2;
  const lab = !bpm || idle0 >= 1500 ? '等你起拍' : bpm < 95 ? '慢板' : bpm < 135 ? '中板' : '急板 · 轮指';
  $('#tempo').style.fontSize = bpm && idle0 < 1500 ? '22px' : '12px';
  $('#tempo').textContent = bpm && idle0 < 1500 ? `${lab}　琴速 ×${cur.playbackRate.toFixed(1)}` : lab;
  const idle = t - S.lastBeat;
  if (idle > 3000 && !turned && t - s6T0 > 4000) { turned = true; say('顾闳中回过头，又看了你一眼。', 2600, '你一停手'); $('#vig').style.background = 'rgba(0,0,0,.25)'; }
  if (idle < 1000 && turned) { turned = false; $('#vig').style.background = ''; }
  S.steady = (S.steady || 0) + (idle < 1300 ? 16.7 : 0);                 // 跟拍的累计时长
  $('#heat i').style.width = clamp(S.steady / 12000) * 100 + '%';
  if (S.steady >= 12000 || t - s6T0 > 35000) { endS6(); }               // 跟拍满 12 秒 = 曲终；35 秒兜底
}
function endS6() {
  S.state = 'toRev'; $('#hint').classList.remove('on'); $('#tempo').style.opacity = 0; $('#vig').style.background = '';
  bed(false);
  const fin = () => card('入画 · 听乐', '这一夜，后来成了《韩熙载夜宴图》<br><span style="font-size:.7em">《韩熙载夜宴图》· 听乐 ｜ Hi3D × AI 视频 × 互动</span>', 600000);
  const toPaint = () => { const pi = $('#paint'); pi.style.transform = ''; pi.style.transition = 'opacity 1.5s'; pi.style.opacity = 1; fadeVol(cur, 0, 1500); setTimeout(fin, 4000); };   /* CG 全景 → 原画：纯叠化，与预览一致 */
  play('bridge2', { onEnd: () => play('revin', { fade: 300, onEnd: () => play('rev', { onEnd: () => play('eend', { until: 0.3, onEnd: toPaint }) }) }) });
  setTimeout(() => say('今夜得见韩公雅集，下官……都记下了。', 3600, '顾闳中 作揖'), 2600);
}

let last = now();
function tick() {
  const t = now(), dt = Math.min(.1, (t - last) / 1000); last = t;
  micStep(dt);
  S.heat = Math.max(0, S.heat - dt * (S.state === 'wait' ? 0.08 : 0.10));   // 不叫好掉得快
  if (S.state !== 'play') $('#heat i').style.width = (['c1', 'c2', 'wait'].includes(S.state) ? clamp(S.heat / TH) * 100 : 0) + '%';
  if (S.state === 'wait' && (S.heat >= TH || t - S.waitT > 20000)) toC3();
  if (S.state === 'play') s6Step();
  $('#hud').textContent = `state=${S.state} heat=${S.heat.toFixed(2)} beats=${S.beats.length} rate=${cur.playbackRate.toFixed(2)} mic=${!!mic}`;
  requestAnimationFrame(tick);
}
$('#go').onclick = async () => {
  $('#go').textContent = '载 入 中'; $('#go').disabled = true;
  if (!Q.has('nomic')) await micOn();
  await preloadAll();                                  // 全部片段加载好再开场，切换时不再缓冲
  $('#cover').style.opacity = 0; setTimeout(() => $('#cover').remove(), 800);
  ({ end: endS6, s6: s6, s5: s5 }[Q.get('from')] || start)();   // 调试：?from=end/s6/s5 直接从某段开始
};
window.__dbg = { VID, S, onBeat, toC3, s6, endS6 };
tick();
</script></body></html>
